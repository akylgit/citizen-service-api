apiVersion: v1
kind: Service
metadata:
  name: {{ include "citizen-service-api.fullname" . }}
  labels:
    {{- include "citizen-service-api.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "citizen-service-api.selectorLabels" . | nindent 4 }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      nodePort: {{ .Values.service.nodePort }}
